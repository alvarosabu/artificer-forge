packages:
  - apps/*
  - packages/*

catalog:
  '@barzhsieh/nuxt-content-mermaid': ^3.0.4
  '@gltf-transform/core': ^4.5.1
  '@gltf-transform/extensions': ^4.5.1
  '@gltf-transform/functions': ^4.5.1
  '@nuxt/icon': ^2.5.1
  draco3dgltf: ^1.5.7
  gsap: ^3.15.0
  sharp: ^0.35.5
  vite: ^8.3.2
  vitest: ^5.0.2

catalogMode: prefer

# pkg.pr.new builds depend on each other by URL. Restore when TresJS PR #1545 is released.
blockExoticSubdeps: false

allowBuilds:
  '@parcel/watcher': false
  # v13 ships prebuilds and needs no build, but pnpm still runs node-gyp for its binding.gyp
  better-sqlite3@12.6.2: true
  better-sqlite3@13.0.3: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

overrides:
  ipx: 3.0.2
  '@tresjs/core': https://pkg.pr.new/@tresjs/core@957d6fb
  '@tresjs/cientos': https://pkg.pr.new/@tresjs/cientos@957d6fb

catalogs:
  build:
    tsdown: 0.21.1
    unplugin-vue: ^8.0.0
    vue-tsc: ^3.3.11
  eslint:
    eslint: ^10.11.0
  nuxt:
    '@iconify-json/heroicons': ^1.2.3
    '@nuxt/content': ^3.16.1
    '@nuxt/eslint': ^1.17.0
    '@nuxt/fonts': 0.14.0
    '@nuxt/icon': 2.2.1
    '@nuxt/ui': ^4.11.2
    '@pinia/nuxt': 0.11.3
    nuxt: ^4.6.0
    zod: ^4.6.5
    zod-to-json-schema: ^3.25.2
  three:
    # TresJS PR #1545 preview build (TSL composables in @tresjs/core/webgpu), pinned to commit 957d6fb
    '@tresjs/cientos': https://pkg.pr.new/@tresjs/cientos@957d6fb
    '@tresjs/core': https://pkg.pr.new/@tresjs/core@957d6fb
    '@tresjs/eslint-config': https://pkg.pr.new/@tresjs/eslint-config@957d6fb
    '@tresjs/leches': https://pkg.pr.new/@tresjs/leches@957d6fb
    '@tresjs/nuxt': https://pkg.pr.new/@tresjs/nuxt@957d6fb
    '@tresjs/post-processing': https://pkg.pr.new/@tresjs/post-processing@957d6fb
    '@tresjs/rapier': https://pkg.pr.new/@tresjs/rapier@957d6fb
    '@types/three': ^0.186.0
    three: ^0.186.1
  typescript:
    typescript: ^5.9.3
  vue:
    '@vueuse/core': ^15.0.0
    pinia: ^4.0.3
    vue: ^3.5.43
    vue-router: ^5.3.1

minimumReleaseAgeExclude:
  - '@gltf-transform/core@4.5.1'
  - '@gltf-transform/extensions@4.5.1'
  - '@gltf-transform/functions@4.5.1'
  - '@tresjs/cientos@5.9.2'
  - '@tresjs/core@5.9.2'
  - '@tresjs/leches@1.3.1 || 1.3.2'
  - '@tresjs/nuxt@5.7.2'
  - '@tresjs/rapier@1.1.3'
