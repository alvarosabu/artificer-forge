packages:
  - apps/*
  - packages/*

catalog:
  '@barzhsieh/nuxt-content-mermaid': ^3.0.4
  '@gltf-transform/core': ^4.5.1
  '@gltf-transform/extensions': ^4.5.1
  '@gltf-transform/functions': ^4.5.1
  '@nuxt/icon': ^2.5.1
  draco3dgltf: ^1.5.7
  gsap: ^3.15.0
  vitest: ^5.0.2

catalogMode: prefer

allowBuilds:
  '@parcel/watcher': false
  # v13 ships prebuilds and needs no build, but pnpm still runs node-gyp for its binding.gyp
  better-sqlite3@12.6.2: true
  better-sqlite3@13.0.3: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

overrides:
  ipx: 3.0.2
  '@nuxt/cli': 4.0.0-alpha.1

catalogs:
  build:
    tsdown: 0.21.1
    unplugin-vue: ^8.0.0
    vue-tsc: ^3.3.11
  eslint:
    eslint: ^10.11.0
  nuxt:
    '@iconify-json/heroicons': ^1.2.3
    '@nuxt/content': ^3.16.1
    '@nuxt/eslint': ^1.17.0
    '@nuxt/fonts': 0.14.0
    '@nuxt/icon': 2.2.1
    '@nuxt/ui': ^4.11.2
    '@pinia/nuxt': 0.11.3
    nuxt: ^4.5.2
    zod: ^4.6.5
    zod-to-json-schema: ^3.25.2
  three:
    '@tresjs/cientos': 5.9.2
    '@tresjs/core': 5.9.2
    '@tresjs/eslint-config': ^1.6.0
    '@tresjs/leches': ^1.3.1
    '@tresjs/nuxt': ^5.7.2
    '@tresjs/post-processing': ^3.9.1
    '@types/three': ^0.186.0
    three: ^0.186.1
  typescript:
    typescript: ^5.9.3
  vue:
    '@vueuse/core': ^15.0.0
    pinia: ^4.0.3
    vue: ^3.5.43
    vue-router: ^5.3.1

minimumReleaseAgeExclude:
  - '@gltf-transform/core@4.5.1'
  - '@gltf-transform/extensions@4.5.1'
  - '@gltf-transform/functions@4.5.1'
  - '@tresjs/cientos@5.9.2'
  - '@tresjs/core@5.9.2'
  - '@tresjs/leches@1.3.1'
  - '@tresjs/nuxt@5.7.2'
